<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV Hub</title>
<style>
:root{--ink:#0a0b1a;--fg:#f4f1ff;--mut:#9a98b8;--glass:rgba(255,255,255,.08);--a:#7c6cff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--ink:#f3f1ff;--fg:#14122e;--mut:#5d5a80;--glass:rgba(20,18,46,.07);color-scheme:light}}
:root[data-theme="light"]{--ink:#f3f1ff;--fg:#14122e;--mut:#5d5a80;--glass:rgba(20,18,46,.07);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);font-family:"Segoe UI","Helvetica Neue",Roboto,Arial,sans-serif;font-weight:300;overflow:hidden}
.aur{position:fixed;left:-25%;top:-25%;right:-25%;bottom:-25%;opacity:.45;background:radial-gradient(38% 38% at 28% 32%,var(--a) 0%,transparent 70%),radial-gradient(34% 34% at 78% 72%,#3b2fd6 0%,transparent 70%);-webkit-animation:drift 28s ease-in-out infinite alternate;animation:drift 28s ease-in-out infinite alternate}
@-webkit-keyframes drift{to{-webkit-transform:translate(6%,4%) rotate(8deg)}}
@keyframes drift{to{transform:translate(6%,4%) rotate(8deg)}}
@-webkit-keyframes draw{to{stroke-dashoffset:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@-webkit-keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@-webkit-keyframes track{from{letter-spacing:3vh;opacity:0}to{letter-spacing:1vh;opacity:1}}
@keyframes track{from{letter-spacing:3vh;opacity:0}to{letter-spacing:1vh;opacity:1}}
@-webkit-keyframes blink{50%{opacity:.2}}
@keyframes blink{50%{opacity:.2}}
.screen{display:none;position:absolute;left:0;top:0;right:0;bottom:0;padding:8vh 6vw;box-sizing:border-box}
.screen.on{display:block;-webkit-animation:fade .6s ease;animation:fade .6s ease}
small{font-size:.28em;font-weight:300;color:var(--a);margin-left:.15em;letter-spacing:0}
.cl{-webkit-animation:blink 1s steps(1) infinite;animation:blink 1s steps(1) infinite}
.hello{font-size:4.2vh;color:var(--mut)}
.time{font-size:23vh;line-height:.95;letter-spacing:-.9vh;margin-top:2vh}
.date{font-size:4.6vh;margin-top:3vh}
.hint{position:absolute;left:6vw;bottom:3.5vh;font-size:2.5vh;color:var(--mut)}
#dock{position:absolute;left:6vw;right:6vw;bottom:8vh}.row{white-space:nowrap;margin-bottom:2.2vh}
.tile{display:inline-block;outline:none;width:20vw;height:13vh;margin-right:1.6vw;padding:1.9vh 1.8vw;box-sizing:border-box;border-radius:2.4vh;background:var(--glass);color:var(--fg);cursor:pointer;vertical-align:top;-webkit-transition:-webkit-transform .25s,background .25s;transition:transform .25s,background .25s,box-shadow .25s}
.tile svg{display:block;width:4.4vh;height:4.4vh;margin-bottom:.8vh}
.tile span{font-size:3vh;font-weight:400}
.tile.f{background:var(--a);color:var(--t,#0a0b1a);-webkit-transform:scale(1.07);transform:scale(1.07);box-shadow:0 2vh 6vh rgba(0,0,0,.35)}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctime{font-size:44vh;line-height:1;letter-spacing:-1.5vh;margin-top:9vh}
.ctime small{font-size:.2em}
#sbar{position:absolute;left:0;bottom:0;height:.9vh;width:0;background:var(--a);-webkit-transition:width 1s linear;transition:width 1s linear}
.ringw{position:relative;width:56vh;height:56vh;margin:1vh auto 0}
.ringw svg{width:100%;height:100%;-webkit-transform:rotate(-90deg);transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--glass);stroke-width:7}
#rp{fill:none;stroke:var(--a);stroke-width:7;stroke-linecap:round;stroke-dasharray:565.5;-webkit-transition:stroke-dashoffset 1s linear;transition:stroke-dashoffset 1s linear}
.rt{position:absolute;left:0;right:0;top:19vh;text-align:center;font-size:13vh;letter-spacing:-.5vh}
.rs{position:absolute;left:0;right:0;top:36vh;text-align:center;font-size:3.4vh;color:var(--mut)}
.up{-webkit-animation:blink .6s steps(1) infinite;animation:blink .6s steps(1) infinite}
.gt{font-size:4.6vh;margin-bottom:2vh}
.gt b{font-weight:300;color:var(--a);margin-left:1.5vw}
#c{display:block;width:76vw;max-height:66vh;border-radius:2vh;background:var(--glass)}
.btn{position:fixed;top:2vh;right:2vw;display:none;padding:1vh 2.6vh;border-radius:5vh;background:var(--glass);font-size:2.6vh;cursor:pointer;z-index:5}
.ov{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;text-align:center;opacity:0;visibility:hidden;-webkit-transition:opacity .35s;transition:opacity .35s,visibility .35s}
.ov.on{opacity:1;visibility:visible}
#spl{background:var(--ink)}
.mk{width:24vh;height:24vh;margin-top:22vh}
.rg{fill:none;stroke:var(--fg);stroke-width:4;stroke-linecap:round;stroke-dasharray:252;stroke-dashoffset:252;-webkit-animation:draw 1.1s ease forwards;animation:draw 1.1s ease forwards}
.dt{fill:#ff7a45;opacity:0;-webkit-animation:fade .5s 1s ease forwards;animation:fade .5s 1s ease forwards}
.wm{font-size:7vh;margin-top:3vh;opacity:0;-webkit-animation:track 1.1s .7s ease forwards;animation:track 1.1s .7s ease forwards}
#tri svg{width:20vh;height:20vh;margin-top:30vh;color:#0a0b1a}
@media (prefers-reduced-motion:reduce){.aur,.cl,.up{-webkit-animation:none;animation:none}}
</style>
</head>
<body>
<div class="aur"></div>

<div id="spl" class="ov on"><svg class="mk" viewBox="0 0 100 100"><circle class="rg" cx="50" cy="50" r="40" transform="rotate(-90 50 50)"/><circle class="dt" cx="50" cy="50" r="9"/></svg><div class="wm">TV Hub</div></div>
<div id="tr" class="ov"><div id="tri"></div></div>

<div id="home" class="screen on">
  <div class="hello" id="greet"></div>
  <div class="time" id="htime"></div>
  <div class="date" id="hdate"></div>
  <div id="dock"></div>
  <div class="hint">Arrow keys to move, OK to open. Streaming apps open in the TV browser.</div>
</div>

<div id="clock" class="screen">
  <div class="ctime" id="cbig"></div>
  <div class="date" id="cdate"></div>
  <div class="hint">Up and down change the colour, Back returns home</div>
  <div id="sbar"></div>
</div>

<div id="timer" class="screen">
  <div class="ringw">
    <svg viewBox="0 0 200 200"><circle class="trk" cx="100" cy="100" r="90"/><circle id="rp" cx="100" cy="100" r="90"/></svg>
    <div class="rt" id="tbig"></div><div class="rs" id="tstate">Ready</div>
  </div>
  <div class="hint">Left and right set minutes, OK starts or pauses, Down resets</div>
</div>

<div id="snake" class="screen">
  <div class="gt">Snake<b id="score">0</b></div>
  <canvas id="c" width="640" height="360"></canvas>
  <div class="hint">Arrows steer, OK restarts</div>
</div>

<div class="btn" id="back">Back</div>

<script>
(function(){
var cur='home',sel=0,busy=true,idle=0,T=null,G=null;
var order=['clock','timer','snake','yt','nf','pv','jh'],rows=[[0,1,2],[3,4,5,6]];
var url={yt:'https://www.youtube.com/tv',nf:'https://www.netflix.com',pv:'https://www.primevideo.com',jh:'https://www.hotstar.com'};
var label={clock:'Clock',timer:'Timer',snake:'Snake',home:'Home',yt:'YouTube',nf:'Netflix',pv:'Prime Video',jh:'JioHotstar'};
var col={home:'#7c6cff',clock:'#ff7a45',timer:'#2ee6c5',snake:'#b6f04a',yt:'#ff4d4d',nf:'#e50914',pv:'#1aa7ff',jh:'#8b6bff'};
var P={clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',timer:'<circle cx="12" cy="13.5" r="7.5"/><path d="M9 2.5h6M12 13.5V9.5"/>',snake:'<path d="M4 19h9a4 4 0 0 0 0-8H9a3 3 0 0 1 0-6h10"/><circle cx="19" cy="5" r="1"/>',home:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/>',play:'<path d="M8 5.5v13l11-6.5z"/>'};
function icon(n){return '<svg class="ic" viewBox="0 0 24 24">'+(P[n]||P.play)+'</svg>';}
function $(i){return document.getElementById(i);}
function pad(n){return (n<10?'0':'')+n;}
var accents=['#ff7a45','#ffc53d','#ff5d8f','#4cc9f0','#c77dff'],ai=0;

/* Dock */
var dock=$('dock'),tiles=[],r,i;
for(r=0;r<rows.length;r++){var rw=document.createElement('div');rw.className='row';dock.appendChild(rw);
 for(i=0;i<rows[r].length;i++){(function(k){var n=order[k];
  var t=document.createElement('div');t.className='tile';t.tabIndex=0;t.style.setProperty('--a',col[n]);if(n==='nf'){t.style.setProperty('--t','#fff');}
  t.innerHTML=icon(n)+'<span>'+label[n]+'</span>';
  t.onclick=function(){sel=k;focusTile();go(n);};
  t.onmouseover=t.onfocus=function(){if(sel!==k){sel=k;focusTile();}};
  rw.appendChild(t);tiles[k]=t;})(rows[r][i]);}}
function focusTile(){var j;for(j=0;j<tiles.length;j++){tiles[j].className='tile'+(j===sel?' f':'');}document.body.style.setProperty('--a',col[order[sel]]);try{tiles[sel].focus();}catch(e){}}

/* Splash: one orchestrated moment, then home */
setTimeout(function(){$('spl').className='ov';busy=false;},2400);

function show(n){
  var s=document.querySelectorAll('.screen'),j;
  for(j=0;j<s.length;j++){s[j].className='screen';}
  $(n).className='screen on';cur=n;
  $('back').style.display=(n==='home')?'none':'block';
  document.body.style.setProperty('--a',n==='home'?col[order[sel]]:(n==='clock'?accents[ai]:col[n]));
  stopT();stopG();
  if(n==='snake'){startG();}
  if(n==='timer'){drawT();}
  tick();
}
function go(n){
  if(busy||n===cur)return;
  busy=true;idle=0;
  $('tr').style.background=n==='home'?col[order[sel]]:(n==='clock'?accents[ai]:col[n]);
  $('tri').innerHTML=icon(n);
  $('tr').className='ov on';
  setTimeout(function(){if(url[n]){window.location.href=url[n];}else{show(n);}},420);
  setTimeout(function(){$('tr').className='ov';busy=false;},1000);
}

/* Time */
var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var mons=['January','February','March','April','May','June','July','August','September','October','November','December'];
function tick(){
  var d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds(),h12=h%12||12,ap=h>=12?'PM':'AM';
  var ds=days[d.getDay()]+', '+d.getDate()+' '+mons[d.getMonth()];
  $('greet').textContent=h<5?'Good night':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night';
  $('htime').innerHTML=h12+':'+pad(m)+'<small>'+ap+'</small>';
  $('hdate').textContent=ds;
  $('cbig').innerHTML=h12+'<span class="cl">:</span>'+pad(m)+'<small>'+pad(s)+'</small>';
  $('cdate').textContent=ds+' '+d.getFullYear();
  $('sbar').style.width=(s===0?0:Math.round(s*100/59))+'%';
}
setInterval(function(){tick();if(cur==='home'&&!busy&&++idle>=45){go('clock');}},1000);tick();

/* Timer */
var mins=10,left=600,running=false;
function drawT(){
  $('tbig').textContent=pad(Math.floor(left/60))+':'+pad(left%60);
  $('rp').style.strokeDashoffset=(565.5*(1-left/(mins*60))).toFixed(1);
}
function beep(){try{var A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(function(){o.stop();},700);}catch(e){}}
function stopT(){if(T){clearInterval(T);T=null;}running=false;}
function toggleT(){
  if(running){stopT();$('tstate').textContent='Paused';return;}
  if(left<=0){left=mins*60;}
  $('tbig').className='rt';running=true;$('tstate').textContent='Running';
  T=setInterval(function(){
    left--;
    if(left<=0){left=0;stopT();$('tstate').textContent='Time is up';$('tbig').className='rt up';beep();}
    drawT();
  },1000);
}
function setMins(d){if(running)return;mins=Math.max(1,Math.min(180,mins+d));left=mins*60;$('tbig').className='rt';$('tstate').textContent=mins+' min';drawT();}
function resetT(){stopT();left=mins*60;$('tbig').className='rt';$('tstate').textContent='Ready';drawT();}

/* Snake */
var cv=$('c'),cx=cv.getContext('2d'),S=20,W=32,H=18,snake,dir,nd,food,score,dead;
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath();cx.fill();}
function newFood(){var ok=false,j;while(!ok){food={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)};ok=true;for(j=0;j<snake.length;j++){if(snake[j].x===food.x&&snake[j].y===food.y){ok=false;}}}}
function resetG(){snake=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];dir={x:1,y:0};nd=dir;score=0;dead=false;$('score').textContent='0';newFood();}
function step(){
  if(dead)return;
  dir=nd;var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y},j;
  if(h.x<0||h.y<0||h.x>=W||h.y>=H){dead=true;draw();return;}
  for(j=0;j<snake.length;j++){if(snake[j].x===h.x&&snake[j].y===h.y){dead=true;draw();return;}}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;$('score').textContent=score;newFood();}else{snake.pop();}
  draw();
}
function draw(){
  var j;cx.clearRect(0,0,640,360);
  cx.fillStyle='#ff5d8f';cx.beginPath();cx.arc(food.x*S+10,food.y*S+10,7,0,6.283);cx.fill();
  for(j=snake.length-1;j>=0;j--){cx.fillStyle=j===0?'#f4f1ff':'#b6f04a';rr(snake[j].x*S+1.5,snake[j].y*S+1.5,S-3,S-3,6);}
  if(dead){cx.fillStyle='rgba(10,11,26,.75)';cx.fillRect(0,0,640,360);cx.fillStyle='#f4f1ff';cx.font='300 40px Arial';cx.textAlign='center';cx.fillText('Game over',320,175);cx.font='300 22px Arial';cx.fillText('Press OK to play again',320,212);}
}
function startG(){resetG();stopG();G=setInterval(step,130);draw();}
function stopG(){if(G){clearInterval(G);G=null;}}
function turn(x,y){if(x!==-dir.x||y!==-dir.y){nd={x:x,y:y};}}

function navG(k){
  var r=sel<3?0:1,row=rows[r],c=row.indexOf(sel),r2,t;
  if(k===37){sel=row[(c+row.length-1)%row.length];}
  else if(k===39){sel=row[(c+1)%row.length];}
  else{r2=(k===40)?1:0;if(r2!==r){t=rows[r2];sel=t[Math.min(c,t.length-1)];}}
  focusTile();
}
/* Remote keys: arrows, OK, and common TV Back codes */
function isBack(k){return k===8||k===27||k===461||k===10009||k===166||k===178;}
document.addEventListener('keydown',function(e){
  var k=e.keyCode;idle=0;if(busy){e.preventDefault();return;}
  if(isBack(k)){if(cur!=='home'){go('home');e.preventDefault();}return;}
  if(cur==='home'){
    if(k===13){go(order[sel]);}else if(k>=37&&k<=40){navG(k);}
  }else if(cur==='clock'){
    if(k===38||k===40){ai=(ai+(k===38?1:accents.length-1))%accents.length;document.body.style.setProperty('--a',accents[ai]);}
  }else if(cur==='timer'){
    if(k===37)setMins(-1);else if(k===39)setMins(1);else if(k===13)toggleT();else if(k===40)resetT();
  }else if(cur==='snake'){
    if(k===37)turn(-1,0);else if(k===39)turn(1,0);else if(k===38)turn(0,-1);else if(k===40)turn(0,1);else if(k===13)resetG();
  }
  if(k>=37&&k<=40)e.preventDefault();
});
$('back').onclick=function(){go('home');};
cv.onclick=function(){if(dead)resetG();};
document.addEventListener('click',function(){idle=0;});
focusTile();
})();
</script>
</body>
</html>
